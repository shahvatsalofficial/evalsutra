name: Publish to npm
# Runs when a GitHub release is published. Uses npm trusted publishing (OIDC): no stored token.
# One-time setup by the maintainer on npmjs.com: package evalsutra > Settings > Trusted Publisher >
# GitHub Actions > owner shahvatsalofficial, repo evalsutra, workflow publish.yml.
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - run: node packages/cli/evalsutra.mjs audit
      - run: npm publish --provenance --access public

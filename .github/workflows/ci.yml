name: Cross-platform CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run validate
      - run: npm run doctor
      - run: node packages/cli/evalsutra.mjs audit --out artifacts/audit
      - run: node scripts/build-docs.mjs --check
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: audit-${{ matrix.os }}
          path: artifacts/audit

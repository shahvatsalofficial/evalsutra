name: Deploy docs to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['documents/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r documents/evalsutra/html _site/html
          cp -r documents/evalsutra/evidence _site/evidence
          printf '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=html/index.html"><title>EvalSutra AI</title><link rel="canonical" href="html/index.html"><p><a href="html/index.html">EvalSutra AI documentation</a></p></html>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

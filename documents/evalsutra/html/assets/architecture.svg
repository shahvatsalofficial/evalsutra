<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
<title id="t">EvalSutra architecture</title>
<desc id="d">Inputs (suite and observations JSON) flow through validation, deterministic graders, scoring and gate, then reporters and the repro capsule. CLI sits on top, skills sit beside it. No network.</desc>
<style>
.bx{fill:#fff;stroke:#4b3fd6;stroke-width:1.6}.bg{fill:#eef0f7;stroke:#8b93a8;stroke-width:1.2}.tx{font:600 14px system-ui,sans-serif;fill:#14161f}.sm{font:12px system-ui,sans-serif;fill:#566074}.ar{stroke:#4b3fd6;stroke-width:2;fill:none;marker-end:url(#a)}.no{fill:#fde8e8;stroke:#a4161a;stroke-width:1.4}
@media (prefers-color-scheme:dark){.bx{fill:#161a24;stroke:#8f86ff}.bg{fill:#1d2232;stroke:#4a5370}.tx{fill:#eceff7}.sm{fill:#9aa4ba}.ar{stroke:#8f86ff}.no{fill:#3a1618;stroke:#ff8d90}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b3fd6"/></marker></defs>
<rect class="bg" x="20" y="20" width="860" height="60" rx="12"/><text class="tx" x="40" y="48">CLI  packages/cli/evalsutra.mjs</text><text class="sm" x="40" y="68">doctor · init · validate · run · compare · report · gate · audit · trace · repro · install · uninstall · list-skills · matrix</text>
<rect class="bx" x="20" y="120" width="150" height="70" rx="10"/><text class="tx" x="36" y="150">Suite JSON</text><text class="sm" x="36" y="170">cases + assertions</text>
<rect class="bx" x="20" y="220" width="150" height="70" rx="10"/><text class="tx" x="36" y="250">Observations</text><text class="sm" x="36" y="270">output, tools, latency</text>
<rect class="bx" x="230" y="150" width="170" height="90" rx="10"/><text class="tx" x="246" y="180">Validate</text><text class="sm" x="246" y="200">schema, ids, regex guard</text><text class="sm" x="246" y="218">typed errors, exit 4</text>
<rect class="bx" x="460" y="120" width="190" height="150" rx="10"/><text class="tx" x="476" y="150">Deterministic core</text><text class="sm" x="476" y="172">graders (pure functions)</text><text class="sm" x="476" y="190">evidence hierarchy</text><text class="sm" x="476" y="208">weighted score + coverage</text><text class="sm" x="476" y="226">Wilson CI · sign test</text><text class="sm" x="476" y="244">gate NO_GO/REVIEW/GO_CANDIDATE</text>
<rect class="bx" x="710" y="120" width="170" height="70" rx="10"/><text class="tx" x="726" y="150">Reporters</text><text class="sm" x="726" y="170">JSON · MD · HTML · JUnit</text>
<rect class="bx" x="710" y="220" width="170" height="70" rx="10"/><text class="tx" x="726" y="250">Repro capsule</text><text class="sm" x="726" y="270">SHA-256 manifest, redacted</text>
<rect class="bx" x="230" y="320" width="170" height="70" rx="10"/><text class="tx" x="246" y="350">Trace analysis</text><text class="sm" x="246" y="370">loops, forbidden, claims</text>
<rect class="bx" x="460" y="320" width="190" height="70" rx="10"/><text class="tx" x="476" y="350">Self-audit</text><text class="sm" x="476" y="370">29 checks → MD + HTML</text>
<rect class="bg" x="710" y="320" width="170" height="70" rx="10"/><text class="tx" x="726" y="350">18 agent skills</text><text class="sm" x="726" y="370">run by the host AI</text>
<rect class="no" x="20" y="420" width="860" height="36" rx="10"/><text class="tx" x="40" y="443">Out of scope in v0.2: network calls · live agent execution · model inference · server · telemetry</text>
<path class="ar" d="M170 155 L230 185"/><path class="ar" d="M170 255 L230 215"/><path class="ar" d="M400 195 L460 195"/><path class="ar" d="M650 155 L710 155"/><path class="ar" d="M650 245 L710 255"/><path class="ar" d="M400 350 L460 350"/><path class="ar" d="M120 80 L120 120"/>
</svg>
